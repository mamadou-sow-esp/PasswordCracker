<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="hollowTri" markerWidth="16" markerHeight="16" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L14,6 L1,11 Z" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
    </marker>
    <marker id="openArrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,5 L1,9" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="780" fill="#f8fafc"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">PasswordCracker v1 — Diagramme de classes (Simple Factory)</text>

  <!-- ===================== RELATIONS (tracées avant les boîtes) ===================== -->
  <!-- Factory ..> HashCracker (retourne / crée) -->
  <line x1="330" y1="205" x2="378" y2="205" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#openArrow)"/>
  <text x="342" y="197" font-size="12" fill="#475569">«crée»</text>

  <!-- PasswordCracker ..> Factory -->
  <path d="M410,120 C360,140 250,140 200,158" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#openArrow)"/>
  <text x="250" y="140" font-size="12" fill="#475569">«utilise»</text>

  <!-- PasswordCracker ..> HashCracker -->
  <path d="M505,120 L505,170" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#openArrow)"/>

  <!-- AbstractHashCracker ..|> HashCracker (réalisation) -->
  <line x1="505" y1="330" x2="505" y2="252" stroke="#334155" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#hollowTri)"/>

  <!-- Dictionary vers Abstract (heritage) -->
  <path d="M270,540 L270,470 L430,470 L430,452" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#hollowTri)"/>
  <!-- BruteForce vers Abstract (heritage) -->
  <path d="M615,540 L615,470 L560,470 L560,452" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#hollowTri)"/>

  <!-- Abstract ..> Md5Utils (dépendance) -->
  <line x1="660" y1="400" x2="712" y2="400" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#openArrow)"/>
  <text x="666" y="392" font-size="12" fill="#475569">«utilise»</text>

  <!-- ===================== BOÎTE : PasswordCracker ===================== -->
  <g>
    <rect x="400" y="56" width="210" height="64" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="400" y="56" width="210" height="30" rx="6" fill="#e2e8f0"/>
    <text x="505" y="70" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">«client / main»</text>
    <text x="505" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">PasswordCracker</text>
    <line x1="400" y1="86" x2="610" y2="86" stroke="#0f172a" stroke-width="1"/>
    <text x="410" y="106" font-size="12" fill="#1e293b" font-family="monospace">+ main(args: String[]): void</text>
  </g>

  <!-- ===================== BOÎTE : HashCrackerFactory ===================== -->
  <g>
    <rect x="40" y="158" width="290" height="94" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
    <rect x="40" y="158" width="290" height="34" rx="6" fill="#fef3c7"/>
    <text x="185" y="173" text-anchor="middle" font-size="11" fill="#92400e" font-style="italic">«Simple Factory»</text>
    <text x="185" y="187" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">HashCrackerFactory</text>
    <line x1="40" y1="192" x2="330" y2="192" stroke="#b45309" stroke-width="1"/>
    <line x1="40" y1="214" x2="330" y2="214" stroke="#e5e7eb" stroke-width="1"/>
    <text x="50" y="238" font-size="12" fill="#1e293b" font-family="monospace">+ create(method: String): HashCracker</text>
    <text x="50" y="208" font-size="11" fill="#94a3b8" font-style="italic">statique</text>
  </g>

  <!-- ===================== BOÎTE : HashCracker (interface) ===================== -->
  <g>
    <rect x="380" y="170" width="250" height="82" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
    <rect x="380" y="170" width="250" height="34" rx="6" fill="#dbeafe"/>
    <text x="505" y="185" text-anchor="middle" font-size="11" fill="#1e40af" font-style="italic">«interface»</text>
    <text x="505" y="199" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">HashCracker</text>
    <line x1="380" y1="204" x2="630" y2="204" stroke="#1d4ed8" stroke-width="1"/>
    <text x="390" y="228" font-size="12" fill="#1e293b" font-family="monospace">+ crack(hash: String): String</text>
  </g>

  <!-- ===================== BOÎTE : AbstractHashCracker ===================== -->
  <g>
    <rect x="360" y="330" width="300" height="122" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <rect x="360" y="330" width="300" height="34" rx="6" fill="#e2e8f0"/>
    <text x="510" y="345" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">«abstraite»</text>
    <text x="510" y="359" text-anchor="middle" font-size="15" font-weight="700" font-style="italic" fill="#1e293b">AbstractHashCracker</text>
    <line x1="360" y1="364" x2="660" y2="364" stroke="#475569" stroke-width="1"/>
    <text x="370" y="384" font-size="12" fill="#1e293b" font-family="monospace">- attempts: long</text>
    <line x1="360" y1="392" x2="660" y2="392" stroke="#e5e7eb" stroke-width="1"/>
    <text x="370" y="412" font-size="12" fill="#1e293b" font-family="monospace"># matches(c: String, h: String): boolean</text>
    <text x="370" y="430" font-size="12" fill="#1e293b" font-family="monospace"># resetAttempts(): void</text>
    <text x="370" y="448" font-size="12" fill="#1e293b" font-family="monospace">+ getAttempts(): long</text>
  </g>

  <!-- ===================== BOÎTE : Md5Utils ===================== -->
  <g>
    <rect x="712" y="356" width="210" height="88" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
    <rect x="712" y="356" width="210" height="34" rx="6" fill="#ccfbf1"/>
    <text x="817" y="371" text-anchor="middle" font-size="11" fill="#0f766e" font-style="italic">«utilitaire»</text>
    <text x="817" y="385" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">Md5Utils</text>
    <line x1="712" y1="390" x2="922" y2="390" stroke="#0f766e" stroke-width="1"/>
    <text x="722" y="414" font-size="12" fill="#1e293b" font-family="monospace">+ md5(input: String)</text>
    <text x="722" y="432" font-size="12" fill="#1e293b" font-family="monospace">    : String  «statique»</text>
  </g>

  <!-- ===================== BOÎTE : DictionaryHashCracker ===================== -->
  <g>
    <rect x="120" y="540" width="300" height="96" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
    <rect x="120" y="540" width="300" height="30" rx="6" fill="#f1f5f9"/>
    <text x="270" y="560" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">DictionaryHashCracker</text>
    <line x1="120" y1="570" x2="420" y2="570" stroke="#334155" stroke-width="1"/>
    <text x="130" y="590" font-size="12" fill="#1e293b" font-family="monospace">- dictionaryName: String</text>
    <line x1="120" y1="598" x2="420" y2="598" stroke="#e5e7eb" stroke-width="1"/>
    <text x="130" y="620" font-size="12" fill="#1e293b" font-family="monospace">+ crack(hash: String): String</text>
  </g>

  <!-- ===================== BOÎTE : BruteForceHashCracker ===================== -->
  <g>
    <rect x="470" y="540" width="300" height="96" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
    <rect x="470" y="540" width="300" height="30" rx="6" fill="#f1f5f9"/>
    <text x="620" y="560" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">BruteForceHashCracker</text>
    <line x1="470" y1="570" x2="770" y2="570" stroke="#334155" stroke-width="1"/>
    <text x="480" y="590" font-size="12" fill="#1e293b" font-family="monospace">- maxLength: int</text>
    <line x1="470" y1="598" x2="770" y2="598" stroke="#e5e7eb" stroke-width="1"/>
    <text x="480" y="620" font-size="12" fill="#1e293b" font-family="monospace">+ crack(hash: String): String</text>
  </g>

  <!-- ===================== LÉGENDE ===================== -->
  <g>
    <rect x="40" y="672" width="880" height="86" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="54" y="694" font-size="13" font-weight="700" fill="#0f172a">Légende</text>

    <line x1="54" y1="716" x2="104" y2="716" stroke="#334155" stroke-width="1.6" marker-end="url(#hollowTri)"/>
    <text x="116" y="720" font-size="12" fill="#334155">héritage (extends)</text>

    <line x1="300" y1="716" x2="350" y2="716" stroke="#334155" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#hollowTri)"/>
    <text x="362" y="720" font-size="12" fill="#334155">réalisation (implements)</text>

    <line x1="600" y1="716" x2="650" y2="716" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#openArrow)"/>
    <text x="662" y="720" font-size="12" fill="#334155">dépendance (utilise / crée)</text>

    <text x="54" y="746" font-size="11" fill="#64748b">Visibilité :  + public    - privé    # protégé</text>
  </g>
</svg>
